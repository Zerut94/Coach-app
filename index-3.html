function getCurrentPhase(){
  const now=new Date();now.setHours(12,0,0,0);
  for(const p of PHASES){const e=new Date(p.end);e.setHours(23,59,59);if(now>=new Date(p.start)&&now<=e)return p;}
  return PHASES[PHASES.length-1];
}
function getDaysUntil(d){const t=new Date(d);t.setHours(23,59,59);const n=new Date();n.setHours(0,0,0,0);return Math.max(0,Math.ceil((t-n)/86400000));}
function getPhaseProgress(p){return Math.min(100,Math.max(0,(Date.now()-new Date(p.start).getTime())/(new Date(p.end).getTime()-new Date(p.start).getTime())*100));}
function fmtDate(d){const[,m,day]=d.split("-");return`${parseInt(day)}/${parseInt(m)}`;}
function getTodayIdx(){const d=new Date().getDay();return d===0?6:d-1;}
function fmtTime(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}

    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1200,scale=Math.min(1,MAX/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg",0.88).split(",")[1]);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Impossibile leggere immagine"));};
    img.src=url;
  });
}

// ── MINI LINE CHART ──
function MiniLineChart({vals,color,label,unit,invert=false,target=null}){
  if(!vals||vals.length<1)return null;
  const nums=vals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  if(nums.length<1)return null;
  const last=nums[nums.length-1];
  const first=nums[0];
  const trend=last-first;
  const trendGood=invert?trend<=0:trend>=0;
  const trendColor=nums.length<2?C.muted:Math.abs(trend)<0.1?C.muted:trendGood?"#22C55E":"#EF4444";
  if(nums.length<2) return(
    <div style={{...sc,marginBottom:8,padding:"10px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{color:C.muted,fontSize:11}}>{label}</span>
        <span style={{color:color,fontWeight:700,fontSize:16}}>{last.toFixed(1)} <span style={{fontSize:10,fontWeight:400}}>{unit}</span></span>
      </div>
      {target&&<div style={{color:C.muted,fontSize:10,marginTop:4}}>Target: {target} {unit}</div>}
    </div>
  );
  const W=300,H=60,PAD=8;
  const minV=Math.min(...nums),maxV=Math.max(...nums);
  const range=maxV-minV||1;
  const pts=nums.map((v,i)=>{
    const x=PAD+(i/(nums.length-1))*(W-PAD*2);
    const y=H-PAD-((v-minV)/range)*(H-PAD*2);
    return{x,y,v};
  });
  const pathD=pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const areaD=pathD+` L${pts[pts.length-1].x.toFixed(1)},${H} L${PAD},${H} Z`;
  return(
    <div style={{...sc,marginBottom:8,padding:"10px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <span style={{color:C.muted,fontSize:11,letterSpacing:.5}}>{label}</span>
        <div style={{display:"flex",alignItems:"baseline",gap:4}}>
          {nums.length>=2&&<span style={{color:trendColor,fontSize:10}}>{trend>0?"+":""}{trend.toFixed(1)}</span>}
          <span style={{color:color,fontWeight:800,fontSize:16}}>{last.toFixed(1)}<span style={{fontSize:10,fontWeight:400,marginLeft:2}}>{unit}</span></span>
        </div>
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible"}}>
        <defs>
          <linearGradient id={`g${label.replace(/\s/g,"")}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity=".25"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={areaD} fill={`url(#g${label.replace(/\s/g,"")})`}/>
        <path d={pathD} fill="none" stroke={color} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"/>
        {pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={i===pts.length-1?4:2.5} fill={i===pts.length-1?color:C.bg} stroke={color} strokeWidth={i===pts.length-1?0:1.5}/>)}
        {target&&(()=>{const ty=H-PAD-((parseFloat(target)-minV)/range)*(H-PAD*2);return ty>0&&ty<H?<line x1={PAD} y1={ty} x2={W-PAD} y2={ty} stroke="#FBBF24" strokeWidth={1} strokeDasharray="4,3" opacity={.7}/>:null;})()}
      </svg>
      {target&&<div style={{color:"#FBBF24",fontSize:9,marginTop:2,textAlign:"right"}}>target: {target} {unit}</div>}
    </div>
  );
}

// ── TIMER OVERLAY ──
function TimerOverlay({timer,onStop}){
  if(!timer)return null;
  const pct=timer.total>0?(timer.left/timer.total)*100:0;
  const done=timer.left<=0;
  const r=40,circ=2*Math.PI*r;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{color:C.muted,fontSize:12,letterSpacing:2,textTransform:"uppercase"}}>Riposo — {timer.label}</div>
      <svg width={120} height={120}>
        <circle cx={60} cy={60} r={r} fill="none" stroke={C.faint} strokeWidth={6}/>
        <circle cx={60} cy={60} r={r} fill="none" stroke={done?"#22C55E":C.accent} strokeWidth={6}
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct/100)} strokeLinecap="round"
          style={{transform:"rotate(-90deg)",transformOrigin:"60px 60px",transition:"stroke-dashoffset .9s linear"}}/>
        <text x={60} y={65} textAnchor="middle" fill={done?"#22C55E":C.text} fontSize={done?20:28} fontWeight={700}>{done?"GO!":fmtTime(timer.left)}</text>
      </svg>
      <button onClick={onStop} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,color:C.muted,fontSize:13,padding:"8px 24px",cursor:"pointer"}}>{done?"Chiudi":"Salta"}</button>
    </div>
  );
}

  const handleImage=async(file)=>{
    if(!file)return;
    setScanning(true);setScanMsg("Elaborazione immagine...");
    try{
      const b64=await preprocessImage(file);
      setScanMsg("Analisi con AI in corso...");
      const apiKey=localStorage.getItem("gak")||"";
      if(!apiKey){ setScanMsg("⚙️ Inserisci prima l'API Key nelle impostazioni (icona ⚙️)"); setScanning(false); return; }
      const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,{
        method:"POST",headers:{"Content-Type":"application/json"},

        ]}]})
      });
      const data=await resp.json();
      const txt=(data.candidates?.[0]?.content?.parts?.[0]?.text||"{}").replace(/```json|```/g,"").trim();
      const parsed=JSON.parse(txt);
      let found=[];
      const upd={};
      if(parsed.weight!=null){upd.weight=String(parsed.weight);found.push("peso");}
      if(parsed.bf!=null){upd.bf=String(parsed.bf);found.push("grasso");}
      if(parsed.muscle!=null){upd.muscle=String(parsed.muscle);found.push("muscolo");}
      if(parsed.hrv!=null){upd.hrv=String(parsed.hrv);found.push("HRV");}
      if(parsed.sleep!=null){upd.sleep=String(parsed.sleep);found.push("sonno");}
      if(parsed.rhr!=null){upd.rhr=String(parsed.rhr);found.push("FC");}
      setForm(p=>({...p,...upd}));
      setScanMsg(found.length>0?`✅ Trovato: ${found.join(", ")}`:"⚠️ Nessun dato riconosciuto — riprova con screenshot più chiaro.");
    }catch(err){setScanMsg("❌ Errore: "+err.message);}
    setScanning(false);setTimeout(()=>setScanMsg(""),5000);
  };

  const submit=()=>{
    if(!form.weight&&!form.hrv)return;
    onAdd({...form,date:new Date().toISOString().split("T")[0]});
    setForm({weight:"",bf:"",muscle:"",hrv:"",sleep:"",rhr:"",energy:3,elbow:"no",notes:""});
    setSaved(true);setTimeout(()=>setSaved(false),2500);
  };

  return(
    <div style={{padding:"8px 16px 90px"}}>
      <div style={{...sc,marginBottom:14}}>
        <div style={{color:C.text,fontSize:15,fontWeight:700,marginBottom:14}}>📋 Check-in settimanale</div>
        <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleImage(e.target.files?.[0])}/>
        <button onClick={()=>fileRef.current.click()} disabled={scanning} style={{width:"100%",marginBottom:scanMsg?8:14,padding:11,background:scanning?"rgba(56,189,248,.1)":"rgba(56,189,248,.08)",border:`1px solid ${scanning?"#38BDF8":"rgba(56,189,248,.3)"}`,borderRadius:10,color:scanning?"#38BDF8":"#A0A0B0",fontSize:13,cursor:scanning?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          {scanning?"🔍 Analisi in corso...":"📷 Importa da screenshot Garmin/Samsung"}
        </button>
        {scanMsg&&<div style={{fontSize:12,marginBottom:14,textAlign:"center",color:scanMsg.startsWith("✅")?"#22C55E":scanMsg.startsWith("⚠️")?"#FBBF24":"#EF4444"}}>{scanMsg}</div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
          {[{k:"weight",l:"Peso (kg)",p:"73.0",t:"number",s:"0.1"},{k:"bf",l:"% Grasso",p:"15.3",t:"number",s:"0.1"},{k:"muscle",l:"Massa musc (kg)",p:"31.9",t:"number",s:"0.1"},{k:"hrv",l:"HRV (ms)",p:"36",t:"number"},{k:"sleep",l:"Sleep score",p:"81",t:"number"},{k:"rhr",l:"FC riposo",p:"52",t:"number"}].map(f=>(
            <div key={f.k}>
              <div style={sl}>{f.l}</div>
              <input style={si} type={f.t} step={f.s} placeholder={f.p} value={form[f.k]} onChange={e=>setForm({...form,[f.k]:e.target.value})}/>
            </div>
          ))}
        </div>
        <div style={{marginBottom:12}}>
          <div style={sl}>Energia soggettiva</div>
          <div style={{display:"flex",gap:5}}>
            {[1,2,3,4,5].map(n=><button key={n} onClick={()=>setForm({...form,energy:n})} style={{flex:1,padding:"7px 0",borderRadius:8,background:form.energy>=n?C.accent:C.faint,border:"none",color:form.energy>=n?"#000":C.muted,fontSize:13,cursor:"pointer",fontWeight:700}}>⚡</button>)}
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <div style={sl}>Gomito</div>
          <div style={{display:"flex",gap:6}}>
            {[["no","✅ Ok"],["mild","⚠️ Lieve"],["bad","🔴 Dolore"]].map(([val,lbl])=>(
              <button key={val} onClick={()=>setForm({...form,elbow:val})} style={{flex:1,padding:"7px 4px",borderRadius:8,cursor:"pointer",background:form.elbow===val?(val==="no"?"rgba(34,197,94,.15)":val==="mild"?"rgba(251,191,36,.15)":"rgba(239,68,68,.15)"):"#16161A",border:`1px solid ${form.elbow===val?(val==="no"?"#22C55E":val==="mild"?"#FBBF24":"#EF4444"):C.border}`,color:C.text,fontSize:11}}>{lbl}</button>
            ))}
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <div style={sl}>Note</div>
          <textarea style={{...si,resize:"none",height:64}} placeholder="Sensazioni, progressi, gomito..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/>
        </div>
        <button onClick={submit} style={{width:"100%",padding:12,background:saved?"#22C55E":C.accent,border:"none",borderRadius:10,color:"#000",fontSize:14,fontWeight:800,cursor:"pointer"}}>{saved?"✓ Salvato!":"Salva Check-in"}</button>
      </div>
      {checkIns.length>0&&(<>
        <div style={sl}>Storico</div>
        {[...checkIns].reverse().map((c,i)=>(
          <div key={i} style={{...sc,marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{color:C.text,fontWeight:600,fontSize:13}}>{c.date}</span>
              <span>{c.elbow==="bad"?"🔴":c.elbow==="mild"?"⚠️":"✅"} {"⚡".repeat(c.energy||0)}</span>
            </div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              {c.weight&&<span style={{color:"#38BDF8",fontSize:12}}>⚖️ {c.weight}kg</span>}
              {c.bf&&<span style={{color:"#FB923C",fontSize:12}}>📊 {c.bf}%</span>}
              {c.muscle&&<span style={{color:"#C084FC",fontSize:12}}>💪 {c.muscle}kg</span>}
              {c.hrv&&<span style={{color:"#22C55E",fontSize:12}}>💚 {c.hrv}ms</span>}
              {c.sleep&&<span style={{color:"#C084FC",fontSize:12}}>😴 {c.sleep}/100</span>}
              {c.rhr&&<span style={{color:"#FB923C",fontSize:12}}>❤️ {c.rhr}bpm</span>}
            </div>
            {c.notes&&<div style={{color:C.muted,fontSize:11,marginTop:6,lineHeight:1.4}}>{c.notes}</div>}
          </div>
        ))}
      </>)}

      {/* Progressione nel tempo */}
      {checkIns.length>=2&&(
        <div style={{marginTop:8}}>
          <div style={{color:C.muted,fontSize:10,letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Progressione nel tempo</div>
          {[
            {key:"weight",label:"Peso",    unit:"kg",  color:"#38BDF8",invert:true},
            {key:"bf",    label:"% Grasso",unit:"%",   color:"#FB923C",invert:true},
            {key:"muscle",label:"Muscolo", unit:"kg",  color:"#C084FC",invert:false},
            {key:"hrv",   label:"HRV",     unit:"ms",  color:"#22C55E",invert:false},
            {key:"sleep", label:"Sonno",   unit:"/100",color:"#A78BFA",invert:false},
          ].map(m=>(
            <MiniLineChart key={m.key}
              vals={checkIns.map(c=>c[m.key]).filter(v=>v!=null&&v!=="")}
              color={m.color} label={m.label} unit={m.unit} invert={m.invert}
            />
          ))}
        </div>
      )}
    </div>
  );
}

// ── TAB PASTI ──
function TabMeal({mealPlan,onSave,phase}){
  const [selDay,setSelDay]=useState(getTodayIdx());
  const [editing,setEditing]=useState(false);
  const [draft,setDraft]=useState({});
  const [saved,setSaved]=useState(false);
  const dayKey=DAY_LABELS[selDay];
  const meals={...DEFAULT_MEAL[dayKey],...(mealPlan[dayKey]||{})};
  return(
    <div style={{padding:"8px 16px 90px"}}>
      <div style={{...sc,marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{color:C.text,fontWeight:700,fontSize:14}}>🍽️ Meal Plan settimanale</div><div style={{color:C.muted,fontSize:11,marginTop:2}}>{phase.kcal} kcal · {phase.carbs} carbo · 155–165g prot</div></div>
          <div style={{background:`${phase.color}18`,border:`1px solid ${phase.color}50`,borderRadius:8,padding:"4px 10px",color:phase.color,fontSize:11,fontWeight:700}}>{phase.short}</div>
        </div>
      </div>
      <div style={{display:"flex",gap:5,marginBottom:14,overflowX:"auto",paddingBottom:2}}>
        {["L","M","M","G","V","S","D"].map((d,i)=>{
          const isToday=i===getTodayIdx();
          return(
            <button key={i} onClick={()=>{setSelDay(i);setEditing(false);}} style={{minWidth:38,height:38,borderRadius:10,border:`1px solid ${selDay===i?C.accent:C.border}`,background:selDay===i?`${C.accent}20`:"#16161A",color:selDay===i?C.accent:isToday?C.text:C.muted,fontSize:13,fontWeight:selDay===i?700:400,cursor:"pointer",position:"relative"}}>
              {d}{isToday&&<div style={{position:"absolute",bottom:3,left:"50%",transform:"translateX(-50%)",width:3,height:3,borderRadius:"50%",background:C.accent}}/>}
            </button>
          );
        })}
      </div>
      <div style={sl}>{DAY_NAMES[selDay]}</div>
      {editing?(
        <div style={{...sc,marginBottom:10}}>
          {MEAL_LABELS.map((mk,mi)=>(
            <div key={mk} style={{marginBottom:12}}>
              <div style={sl}>{MEAL_NAMES[mi]}</div>
              <textarea style={{...si,resize:"none",height:56,fontSize:13}} value={draft[mk]||""} onChange={e=>setDraft(p=>({...p,[mk]:e.target.value}))}/>
            </div>
          ))}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setEditing(false)} style={{flex:1,padding:10,background:"#16161A",border:`1px solid ${C.border}`,borderRadius:10,color:C.muted,fontSize:13,cursor:"pointer"}}>Annulla</button>
            <button onClick={()=>{onSave(dayKey,draft);setEditing(false);setSaved(true);setTimeout(()=>setSaved(false),2000);}} style={{flex:1,padding:10,background:saved?"#22C55E":C.accent,border:"none",borderRadius:10,color:"#000",fontSize:13,fontWeight:800,cursor:"pointer"}}>{saved?"✓":"Salva"}</button>
          </div>
        </div>
      ):(
        <>
          {MEAL_LABELS.map((mk,mi)=>(
            <div key={mk} style={{...sc,marginBottom:8}}>
              <div style={{color:C.muted,fontSize:11,marginBottom:4}}>{MEAL_NAMES[mi]}</div>
              <div style={{color:C.text,fontSize:13,lineHeight:1.5}}>{meals[mk]||"—"}</div>
            </div>
          ))}
          <button onClick={()=>{setDraft({...meals});setEditing(true);}} style={{width:"100%",padding:11,marginTop:4,background:"#16161A",border:`1px solid ${C.border}`,borderRadius:10,color:C.muted,fontSize:13,cursor:"pointer"}}>✏️ Modifica {DAY_NAMES[selDay].toLowerCase()}</button>
        </>
      )}
    </div>
  );
}

// ── TAB COACH ──
function TabCoach({phase,checkIns,exEdits}){
  const welcome=`Ciao Giacomo! 👋\n\nSiamo in ${phase.emoji} **${phase.short} — ${phase.name}**, termina il ${fmtDate(phase.end)} (${getDaysUntil(phase.end)}g rimasti).\n\nCosa vuoi discutere?`;
  const [msgs,setMsgs]=useState([{role:"assistant",content:welcome}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const botRef=useRef(),inRef=useRef();
  useEffect(()=>{botRef.current?.scrollIntoView({behavior:"smooth"});},[msgs,loading]);
  const send=async()=>{
    const txt=input.trim();if(!txt||loading)return;
    setInput("");
    const newMsgs=[...msgs,{role:"user",content:txt}];
    setMsgs(newMsgs);setLoading(true);
    const ciCtx=checkIns.length>0?"\n\nULTIMI CHECK-IN:\n"+checkIns.slice(-3).map(c=>`• ${c.date}: ${[c.weight&&`peso ${c.weight}kg`,c.bf&&`BF ${c.bf}%`,c.hrv&&`HRV ${c.hrv}ms`,c.sleep&&`sleep ${c.sleep}`,`gomito:${c.elbow}`,`energia:${c.energy}/5`].filter(Boolean).join(", ")}${c.notes?` — "${c.notes}"`:""}` ).join("\n"):"";
    const exCtx=Object.keys(exEdits).length>0?"\n\nMODIFICHE CARICHI:\n"+Object.entries(exEdits).map(([k,v])=>`${k}: ${Object.entries(v).map(([id,e])=>`${id}→${e.weight||"?"}kg×${e.reps||"?"}`).join(", ")}`).join("\n"):"";
    const sys=SYSTEM_PROMPT+ciCtx+exCtx+`\n\nFASE CORRENTE: ${phase.short} (${fmtDate(phase.start)}–${fmtDate(phase.end)}, ${phase.kcal} kcal, ${getDaysUntil(phase.end)}g rimasti)`;
    const apiMsgs=newMsgs.slice(1).slice(-14).map(m=>({role:m.role,content:m.content}));
    try{
      const apiKey=localStorage.getItem("gak")||"";
      if(!apiKey){
        setMsgs(p=>[...p,{role:"assistant",content:"⚙️ API Key mancante. Tocca l'icona ⚙️ in alto a destra → segui le istruzioni per ottenere la chiave Google Gemini gratuita su aistudio.google.com"}]);
        setLoading(false); return;
      }
      const geminiMsgs=apiMsgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          system_instruction:{parts:[{text:sys}]},
          contents:geminiMsgs,
          generationConfig:{maxOutputTokens:1000,temperature:0.7}
        })
      });
      const data=await res.json();
      const reply=data.candidates?.[0]?.content?.parts?.[0]?.text||data.error?.message||"Errore nella risposta.";
      setMsgs(p=>[...p,{role:"assistant",content:reply}]);
    }catch(e){
      setMsgs(p=>[...p,{role:"assistant",content:"Errore di connessione. Controlla connessione internet e riprova."}]);
    }
    setLoading(false);
  };
  return(
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 126px)"}}>
      <div style={{flex:1,overflowY:"auto",padding:"8px 16px 8px"}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{marginBottom:10,display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
            <div style={{maxWidth:"88%",background:m.role==="user"?C.accent:"#1A1A20",border:m.role==="user"?"none":`1px solid ${C.border}`,borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",padding:"10px 13px",color:m.role==="user"?"#000":"#E8E8F0",fontSize:13,lineHeight:1.55,whiteSpace:"pre-wrap"}}>
              {m.content}
            </div>
          </div>
        ))}
        {loading&&<div style={{display:"flex",gap:5,padding:"8px 4px"}}>{[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:"50%",background:C.accent,opacity:.7,animation:`bounce 1.2s ease-in-out ${i*.2}s infinite`}}/>)}</div>}
        <div ref={botRef}/>
      </div>
      {msgs.length<3&&(
        <div style={{padding:"0 16px 8px",display:"flex",gap:6,overflowX:"auto"}}>
          {["Modifica i carichi","Genera meal plan","Gestione gomito","Analizza check-in"].map(q=>(
            <button key={q} onClick={()=>{setInput(q);setTimeout(()=>inRef.current?.focus(),0);}} style={{background:"#16161A",border:`1px solid ${C.border}`,borderRadius:20,color:"#A0A0B0",fontSize:11,padding:"6px 12px",whiteSpace:"nowrap",cursor:"pointer",flexShrink:0}}>{q}</button>
          ))}
        </div>
      )}
      <div style={{padding:"10px 16px 16px",borderTop:`1px solid ${C.border}`,background:"rgba(12,12,15,.97)"}}>
        <div style={{display:"flex",gap:8}}>
          <input ref={inRef} style={{flex:1,...si,borderRadius:22,padding:"10px 14px",fontSize:13}} placeholder="Chiedi al coach..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
          <button onClick={send} disabled={loading} style={{background:loading?C.faint:C.accent,border:"none",borderRadius:"50%",width:42,height:42,display:"flex",alignItems:"center",justifyContent:"center",color:loading?C.muted:"#000",fontSize:18,cursor:loading?"default":"pointer",flexShrink:0}}>→</button>
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ──
function App(){
  const [tab,setTab]=useState("home");
  const [subPage,setSubPage]=useState(null);
  const [checkIns,setCheckIns]=useState([]);
  const [exEdits,setExEdits]=useState({});
  const [mealPlan,setMealPlan]=useState({});
  const [assessments,setAssessments]=useState([]);
  const [showAssessment,setShowAssessment]=useState(false);
  const [showSettings,setShowSettings]=useState(()=>!localStorage.getItem("gak"));
  const [timer,setTimer]=useState(null);
  const [ready,setReady]=useState(false);
  const timerRef=useRef();
  const phase=getCurrentPhase();

  useEffect(()=>{
    Promise.all([ld("ci_v3"),ld("ex_v3"),ld("meal_v3"),ld("asmnt_v1")]).then(([ci,ex,mp,as])=>{
      if(ci)setCheckIns(ci);if(ex)setExEdits(ex);if(mp)setMealPlan(mp);if(as)setAssessments(as);setReady(true);
    });
  },[]);

  useEffect(()=>{
    if(timer&&timer.left>0){timerRef.current=setTimeout(()=>setTimer(t=>t?{...t,left:t.left-1}:null),1000);}
    return()=>clearTimeout(timerRef.current);
  },[timer]);

  const addCheckin=async(e)=>{const u=[...checkIns,e];setCheckIns(u);await sv("ci_v3",u);};
  const addAssessment=async(e)=>{const u=[...assessments,e];setAssessments(u);await sv("asmnt_v1",u);};
  const saveExEdits=async(k,v)=>{const u={...exEdits,[k]:v};setExEdits(u);await sv("ex_v3",u);};
  const saveMeal=async(dk,m)=>{const u={...mealPlan,[dk]:m};setMealPlan(u);await sv("meal_v3",u);};

  if(!ready)return<div style={{background:C.bg,height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontSize:40}}>⛰️</div>;

  const TABS=[{id:"home",icon:"🏠",label:"Home"},{id:"piano",icon:"📅",label:"Piano"},{id:"checkin",icon:"📊",label:"Check-in"},{id:"pasti",icon:"🍽️",label:"Pasti"},{id:"coach",icon:"💬",label:"Coach"}];

  return(
    <div style={{background:C.bg,minHeight:"100vh",color:C.text,maxWidth:480,margin:"0 auto"}}>
      <TimerOverlay timer={timer} onStop={()=>setTimer(null)}/>
      {showAssessment?(
        <AssessmentTracker assessments={assessments} onAdd={addAssessment} onBack={()=>setShowAssessment(false)}/>
      ):subPage?(
        <SessionDetail phaseId={subPage.phaseId} dayIdx={subPage.dayIdx} session={subPage.session} onBack={()=>setSubPage(null)} exEdits={exEdits} onSaveEdits={saveExEdits} onStartTimer={(s,l)=>setTimer({total:s,left:s,label:l})}/>
      ):(
        <>
          {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)}/>}
          <div style={{padding:"14px 16px 12px",borderBottom:`1px solid #1A1A22`,position:"sticky",top:0,background:"rgba(12,12,15,.95)",backdropFilter:"blur(10px)",zIndex:50}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div><div style={{fontSize:16,fontWeight:800,letterSpacing:-.5}}>{phase.emoji} Giacomo · Coach AI</div><div style={{color:"#4A4A58",fontSize:10,marginTop:2}}>{phase.short} · {phase.name} · {getDaysUntil(phase.end)}g alla fine fase</div></div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <button onClick={()=>setShowSettings(true)} style={{background:"transparent",border:"none",color:"#3A3A48",fontSize:18,cursor:"pointer",padding:"2px 4px"}}>⚙️</button>
                <div style={{background:`${phase.color}18`,border:`1px solid ${phase.color}50`,borderRadius:8,padding:"4px 10px",color:phase.color,fontSize:12,fontWeight:700}}>{phase.kcal} kcal</div>
              </div>
            </div>
          </div>
          <div style={{paddingTop:8}}>
            {tab==="home"   &&<TabDashboard phase={phase} checkIns={checkIns} onGoSession={(p,d,s)=>setSubPage({phaseId:p,dayIdx:d,session:s})} onGoAssessment={()=>setShowAssessment(true)}/>}
            {tab==="piano"  &&<TabPiano phase={phase} onGoSession={(p,d,s)=>setSubPage({phaseId:p,dayIdx:d,session:s})}/>}
            {tab==="checkin"&&<TabCheckin checkIns={checkIns} onAdd={addCheckin}/>}
            {tab==="pasti"  &&<TabMeal mealPlan={mealPlan} onSave={saveMeal} phase={phase}/>}
            {tab==="coach"  &&<TabCoach phase={phase} checkIns={checkIns} exEdits={exEdits}/>}
          </div>
          <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"rgba(12,12,15,.97)",borderTop:`1px solid #1A1A22`,display:"flex",padding:"8px 0 14px",zIndex:50}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",padding:0}}>
                <span style={{fontSize:tab===t.id?22:19,lineHeight:1}}>{t.icon}</span>
                <span style={{fontSize:9,fontWeight:tab===t.id?700:400,color:tab===t.id?C.accent:"#3A3A48"}}>{t.label}</span>
                {tab===t.id&&<div style={{width:3,height:3,borderRadius:"50%",background:C.accent}}/>}
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
